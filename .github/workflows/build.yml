name: Build macOS DMG
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and disk image
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-Sensor-macOS
          path: build/Xiaomi-Sensor.dmg
          if-no-files-found: error
