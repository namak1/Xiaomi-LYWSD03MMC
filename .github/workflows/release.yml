name: Publish macOS release
on:
  push:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: bash scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.2.0 build/Xiaomi-Sensor.dmg --target "$GITHUB_SHA" --title "Xiaomi Sensor 1.2.0" --notes "Adds adjustable scheduled readings, sensor history import, local storage and CSV export. Keep the app open and the Mac awake. Original-firmware history timestamps are estimated and imports can take minutes. Requires macOS 14 or newer. This ad-hoc signed build is not notarized. Bluetooth, history import and widget behavior have not been tested on physical hardware."
