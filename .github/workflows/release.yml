name: Publish macOS release
on:
  push:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: bash scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0 build/Xiaomi-Sensor.dmg --target "$GITHUB_SHA" --title "Xiaomi Sensor 2.0.0" --notes "Adds a macOS background item that restarts the monitor without a Dock icon after quitting, and imports newer sensor history after readings. Allow the background item in System Settings if prompted. Widget refresh timing is controlled by macOS. Registration, Bluetooth and incremental history require testing on a physical Mac and sensor. Requires macOS 14 or newer; ad-hoc signed and not notarized."
