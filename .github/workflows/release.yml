name: Publish macOS release
on:
  push:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: bash scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.0 build/Xiaomi-Sensor.dmg --target "$GITHUB_SHA" --title "Xiaomi Sensor 1.4.0" --notes "Redesigns the native desktop widget to resemble the LYWSD03MMC LCD, with a comfort face and segmented digits. Requires macOS 14 or newer. Install in Applications and open once before adding the widget. The app is ad-hoc signed and not notarized; widget discovery depends on macOS and has not been verified on a physical Mac."
