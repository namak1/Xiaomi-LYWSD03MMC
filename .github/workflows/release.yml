name: Publish macOS release
on:
  push:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: bash scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.9.0 build/Xiaomi-Sensor.dmg --target "$GITHUB_SHA" --title "Xiaomi Sensor 1.9.0" --notes "Keeps monitoring active in the menu bar when closing the window or pressing Command-Q, and reports widget snapshot write errors. Choose Stop Monitoring and Quit to stop the process. Widget refresh times remain controlled by macOS. Quitting the app stops monitoring. Widget refresh timing is controlled by macOS. Requires macOS 14 or newer. Install in Applications and open once before adding the widget. The app is ad-hoc signed and not notarized; widget discovery and the revised appearance have not been verified on a physical Mac."
