name: Publish macOS release
on:
  push:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: bash scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.1 build/Xiaomi-Sensor.dmg --target "$GITHUB_SHA" --title "Xiaomi Sensor 2.0.1" --notes "Improves widget contrast in tinted desktop rendering. Includes background monitoring and incremental history introduced in 2.0. The widget, background item and Bluetooth remain unverified on physical hardware. Requires macOS 14 or newer; ad-hoc signed and not notarized."
