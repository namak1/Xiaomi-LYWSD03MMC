name: Publish macOS release
on:
  push:
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: bash scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.0 build/Xiaomi-Sensor.dmg --target "$GITHUB_SHA" --title "Xiaomi Sensor 1.1.0" --notes "Adds a native macOS desktop widget. Requires macOS 14 or newer. Widget refreshes are managed by macOS; keep the app running for sensor readings. This ad-hoc signed build is not notarized. Hardware connection and widget registration have not been verified."
